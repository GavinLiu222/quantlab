[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "End-to-end config-driven quant research backend: data -> factors -> return model -> portfolio optimization -> target positions -> backtest."
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "quantlab/factor/predefined/_support/KUNQUANT_LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Zhaorong Dai" }]
keywords = ["quant", "backtest", "factor", "xarray", "zarr", "portfolio-optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "bottleneck>=1.5.0",
    "exchange-calendars>=4.13.2",
    "joblib>=1.6.0",
    "kunquant>=0.1.11",
    "loguru>=0.7.3",
    "lxml>=6.1.3",
    "matplotlib>=3.11.1",
    # The approximate backtest's compiled mean-variance loops (vectorbt needs it too).
    "numba>=0.67.0",
    "numpy>=2.3.2",
    "pandas>=3.0.5",
    "plotly<6",
    "polars>=1.44.1",
    "psutil>=7.2.2",
    "psycopg2-binary>=2.9.13",
    # pandas -> polars conversion of non-numpy columns, and parquet I/O.
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "tiingo>=0.16.1",
    "torch>=2.14.0",
    "tqdm>=4.70.0",
    "vectorbt>=0.28.2",
    "xarray>=2026.7.0",
    "xgboost>=3.4.1",
    "zarr>=3.3.0",
]

[project.urls]
Homepage = "https://github.com/ZhaorongDai/quantlab"
Repository = "https://github.com/ZhaorongDai/quantlab"
Documentation = "https://github.com/ZhaorongDai/quantlab/tree/main/docs"
Issues = "https://github.com/ZhaorongDai/quantlab/issues"

[project.optional-dependencies]
# Each extra is the dependency of the modules named beside it; importing such a
# module without its extra raises an ImportError that names the extra.
# quantlab.acquisition.massive
massive = ["boto3>=1.43.110", "botocore>=1.43.110"]
# quantlab.portfolio.predefined.mean_variance
optimize = ["cvxpy>=1.9.3"]
# quantlab.model.predefined.realmlp and xgb_td
tabkit = ["pytabkit>=1.7.3"]
# quantlab.tracking.wandb
wandb = ["wandb>=0.29.0"]
all = [
    "boto3>=1.43.110",
    "botocore>=1.43.110",
    "cvxpy>=1.9.3",
    "mlflow-skinny>=3.0",
    "protobuf>=7",
    "pytabkit>=1.7.3",
    "wandb>=0.29.0",
]
# quantlab.tracking.mlflow
mlflow = [
    "mlflow-skinny>=3.0",
    # Without it the one lock resolution moves protobuf (which wandb uses)
    # back to 6.x for every install, not only for this extra.
    "protobuf>=7",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    # scripts/data_update reads its YAML config.
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["quantlab*"]
namespaces = false

[tool.setuptools.package-data]
"quantlab.config" = ["instruments.yaml"]
"quantlab.factor.predefined._support" = ["KUNQUANT_LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["."]
# A test that runs past this many seconds dumps every thread's stack and ends
# the run, so a deadlock in native code fails instead of hanging.
# The slowest test takes about 15 s.
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true
