# The daily data update: scripts/data_update/update.py runs these stages in order, every
# weekday morning (scripts/data_update/update_daily.sh, from cron). Paths are relative to the
# data root (--data-dir). A store folder named by `update` or `extend` holds the store,
# a README.md and a component.json (the component's get_config(), rebuilt with
# quantlab.core.component.rebuild); `update` calls the dataset's update(), `extend`
# extends a factor or a factor risk model to t, the last bar of the `calendar` store once
# the raw stage is done. When it finishes, the script writes <data-dir>/update_status.json,
# which the paper trading waits for (docs/data_update.md).
#
# Actions:
#   sharadar:   scripts/sharadar/update.py (every Sharadar table to market/ and universe/)
#   fred:       download the FRED series from `start` (required), then update the store in that folder
#   benchmarks: scripts/sharadar/price_return_benchmark.py --refresh for the tickers
#   update:     a dataset rebuilt from <folder>/component.json, update()
#   mirror:     append the source dataset's new bars to a store copying its variables
#   extend:     a factor or factor risk model rebuilt from <folder>/component.json, to t
#   run:        any repository script: {script: ..., args: [... {data_dir} ...], writes: [...], reads: [...]}
# `writes` (sharadar, benchmarks, run) and `reads` (run) list store folders or folder prefixes
# ending in /; the other actions write their `store`. --check orders reads against later writes.
# After editing, run `scripts/data_update/update.py --check`.
# A step with `allow_failure: true` is recorded as failed when it raises, and the run goes on.
# A stage with `after_done: true` runs once `done` is written; nothing waiting for `done` waits for it.

# The store whose last bar, after the raw stage, is the day t everything is brought to.
calendar: market/sharadar/sharadar_sep_1d

# Stores that must hold t after the raw stage; until they do, the raw stage is retried.
ready:
  - market/sharadar/sharadar_sep_1d
  - market/sharadar/sharadar_daily_1d
  - market/sharadar/sharadar_industry_1d
  - market/sharadar/sharadar_share_class_1d
  - market/sharadar/sharadar_sfp_1d

stages:
  - name: raw
    steps:
      # A table no strategy reads failing (a vendor hiccup) must not hold the day; the ready stores decide.
      # TICKERS is read with its history (#263), so a row the vendor drops for a day no longer
      # takes a security off a store; --rebuild-dropped is left for a real move of rows.
      - sharadar: {args: [--rebuild-dropped], allow_failure: true, writes: [market/sharadar/, universe/sharadar/]}
      # IWV alone from the SFP raw tier the sharadar step pulled (MASTER's market features read it);
      # scripts/sharadar/update.py keeps SPY but not IWV.
      - update: market/sharadar/sharadar_iwv_1d
      - fred: {series: [DTB3], start: "1954-01-04", store: market/fred/fred_dtb3_1d}
      - benchmarks: {tickers: [vt, spy, acwi], writes: [market/benchmarks/]}
      # Massive's REST endpoints (splits, dividends) into the raw tier, each from its watermark
      # (docs/massive.md, "REST pulls"); raw files only, so a failure holds nothing.
      - run:
          script: scripts/massive/rest_pull.py
          args: [--download-dir, "{download_dir}"]
          writes: []
          allow_failure: true
  - name: market-factors
    steps:
      - extend: factors/market/barra_style
      # Cross-sectional factors on the whole market (common stocks), read on a roster (2026-10-15);
      # no strategy reads them yet, so a failure does not hold the day.
      - extend: {store: factors/market/alpha101, allow_failure: true}
      - extend: {store: factors/market/alpha158, allow_failure: true}
      - extend: {store: factors/market/alpha101_neutral, allow_failure: true}
      - extend: {store: factors/market/alpha158_neutral, allow_failure: true}
      - extend: {store: factors/market/beta_spy, allow_failure: true}
      - extend: {store: factors/market/beta_spy_neutral, allow_failure: true}
      # The next-bar open-to-open return of the whole market, read as MembershipMaskedLabel on a universe.
      - extend: {store: labels/market/ret_1, allow_failure: true}
  - name: universe
    steps:
      - update: universe/us3000/membership_estu
      # Every common stock of the whole-market SEP store, first to last priced bar (the market
      # portfolio of the Black-Litterman equilibrium).
      - update: {store: universe/sharadar/sharadar_common_stock_membership, allow_failure: true}
  - name: factors
    steps:
      - extend: factors/us3000/alpha101
      - extend: factors/us3000/alpha158
      - extend: factors/us3000/alpha101_neutral
      - extend: factors/us3000/alpha158_neutral
  - name: risk
    steps:
      - extend: risk/use4
  # Intraday trades, run once `done` is written (`after_done`), so a late, slow or failed Massive day
  # never holds the paper trading; none of its stores is in `ready`, and each step does at most five days
  # (a store far behind is caught up by a run of its own). The Trade bars need Massive's files of t (published the
  # morning after), the Ticker map also Sharadar's SEP of t (the raw stage) and the day aggregates
  # the conversion downloads.
  - name: intraday
    after_done: true
    steps:
      - run:
          script: scripts/massive/convert.py
          args: [--download-dir, "{download_dir}", --data-dir, "{data_dir}", --download, --workers, "2", --threads, "8", --max-days, "5", --idle-hours, "2"]
          writes: [market/massive/massive_trade_bars_1m]
          allow_failure: true
      # Massive's own daily bars on the Massive ticker (MassiveDayBarDataset): appends every day
      # aggregate file the conversion above downloaded after the store's last day.
      - run:
          script: scripts/massive/day_bars.py
          args: [--download-dir, "{download_dir}", --data-dir, "{data_dir}"]
          writes: [market/massive/massive_day_bars_1d]
          allow_failure: true
      - run:
          script: scripts/massive/ticker_map.py
          args: [--download-dir, "{download_dir}", --data-dir, "{data_dir}", --max-days, "5"]
          writes: [market/massive/massive_ticker_map]
          reads: [market/sharadar/sharadar_sep_1d]
          allow_failure: true
      # The Trade bars mapped onto permatickers (MappedTradeBarDataset): maps again any stored day whose
      # map rows changed, then appends every day both stores above now hold (about 10 s a day; a store
      # far behind is caught up by scripts/massive/permaticker_bars.py --workers N).
      - update: {store: market/massive/massive_permaticker_bars_1m, allow_failure: true}
      # Massive's Day aggregates mapped onto permatickers (MappedDayBarDataset), the same way: maps
      # again any stored day whose map rows changed, then appends every day the Day aggregate store
      # and the Ticker map both hold (first build: scripts/massive/permaticker_day_bars.py).
      - update: {store: market/massive/massive_permaticker_day_bars_1d, allow_failure: true}
      # The daily factors of the one-minute bars, on the whole market (common stocks), in dependency
      # order: the per-session statistics, their 20-session means and the neutralized means, then the
      # rank composites of the statistics. They hold the day only for their readers, so they wait
      # with the minute store and a failure does not hold anything.
      - extend: {store: factors/market/intraday_stats, allow_failure: true}
      - extend: {store: factors/market/intraday_stats_20d, allow_failure: true}
      - extend: {store: factors/market/intraday_stats_20d_neutral, allow_failure: true}
      - extend: {store: factors/market/intraday_signals, allow_failure: true}
      - extend: {store: factors/market/intraday_low_corr, allow_failure: true}
