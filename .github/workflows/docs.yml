name: Docs

# Builds the documentation site (docs/conf.py) on every push and pull request, and
# deploys it to GitHub Pages from main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      # autodoc imports every module, so the build needs every extra.
      - name: Install
        run: uv sync --locked --all-extras --group docs

      - name: Check runnable examples
        run: uv run python tools/check_docs_examples.py

      - name: Build
        run: uv run sphinx-build -W --keep-going -b html -j auto docs docs/_build/html

      - name: Check rendered documentation
        run: uv run python tools/check_docs_html.py docs/_build/html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
