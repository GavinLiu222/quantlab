name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 60 }}
    # Windows is not a supported platform yet: it runs only on a manual dispatch, for
    # information, and does not fail the workflow.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu matches the Linux training server; macos (arm64) matches the dev host,
        # where the darwin-only paths run (OpenMP guard, KunQuant symbol padding).
        os: >-
          ${{ github.event_name == 'workflow_dispatch'
          && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]')
          || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install libomp (macOS)
        # xgboost's macOS wheel links Homebrew's libomp.dylib and does not bundle it.
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Put MSVC on PATH (Windows)
        # KunQuant compiles factor graphs to native code at run time with the host
        # C++ compiler.
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install the locked environment
        run: uv sync --locked --dev --all-extras

      - name: Test suite
        # test_crsp_rebuild_measurements.py rebuilds the real CRSP store under data/;
        # it is a local gate on real data, not a unit test.
        # Windows prints each test name, so a failure or a hang can be located.
        run: >-
          uv run pytest --ignore=tests/test_crsp_rebuild_measurements.py
          ${{ matrix.os == 'windows-latest' && '-v --durations=20' || '-q' }}

      - name: API doctests
        run: uv run pytest -q --doctest-modules quantlab/api/
